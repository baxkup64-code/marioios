name: build-kitmod

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        shell: bash
        run: |
          set -eo pipefail
          pip install lief capstone
          npm install -g esbuild

      - name: Struktur prüfen
        shell: bash
        run: |
          set -eo pipefail
          for f in tools/build_hooks.py hooks.json debug_ios.ts dylib/km_runtime.c dylib/prelude.js dylib/Makefile; do
            test -f "$f" || { echo "FEHLER: $f fehlt im Repo"; echo "--- vorhandene Dateien ---"; find . -path ./.git -prune -o -type f -print | head -100; exit 1; }
          done
          echo "Struktur ok"

      - name: Binary entpacken
        shell: bash
        run: |
          set -eo pipefail
          test -f input/Brawl_Stars.zip || { echo "FEHLER: input/Brawl_Stars.zip fehlt"; exit 1; }
          unzip -o input/Brawl_Stars.zip -d input
          if [ -f "input/Brawl Stars" ]; then
            mv "input/Brawl Stars" input/Brawl_Stars
          fi
          test -f input/Brawl_Stars || { echo "FEHLER: weder 'Brawl Stars' noch 'Brawl_Stars' im ZIP"; ls -la input; exit 1; }
          file input/Brawl_Stars

      - name: Binary patchen
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p out
          python3 tools/build_hooks.py input/Brawl_Stars hooks.json out/Brawl_Stars_patched dylib/ 2>&1 | tee out/build_hooks.log
          test -f dylib/kitmod_gen.h || { echo "FEHLER: kitmod_gen.h wurde nicht erzeugt"; exit 1; }
          test -f dylib/kitmod_tramp.S || { echo "FEHLER: kitmod_tramp.S wurde nicht erzeugt"; exit 1; }
          test -f out/Brawl_Stars_patched || { echo "FEHLER: gepatchte Binary wurde nicht erzeugt"; exit 1; }

      - name: Dylib bauen
        shell: bash
        run: |
          set -eo pipefail
          cd dylib
          make 2>&1 | tee ../out/make.log
          test -f kitmod.dylib || { echo "FEHLER: kitmod.dylib wurde nicht erzeugt"; exit 1; }
          cp kitmod.dylib ../out/kitmod.dylib

      - name: Ergebnis vorbereiten
        shell: bash
        run: |
          set -eo pipefail
          cp out/Brawl_Stars_patched "out/Brawl Stars"
          ls -la out
          file out/kitmod.dylib "out/Brawl Stars"
          otool -l "out/Brawl Stars" | grep -A4 "__KMTEXT\|__KMDATA" || true

      - name: Artefakte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kitmod-build
          path: out/
          if-no-files-found: warn
